<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Disneyland Challenge — Top 10</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#f6f7fc; --ink:#0f172a; --muted:#64748b; --card:#ffffff; --border:#e5e7eb;
      --primary:#1d4ed8; --purple:#6d28d9; --gold:#f59e0b; --silver:#9ca3af; --bronze:#b45309;
      --row:#f8fafc; --row2:#f1f5f9; --hover:#eef2ff;
    }
    html,body{height:100%}
    body{font-family:sans-serif;background:radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0, transparent 60%),radial-gradient(900px 500px at 110% -20%, #fae8ff 0, transparent 55%),var(--bg);margin:0;color:var(--ink)}
    .wrap{max-width:980px;margin:0 auto;padding:28px}
    .hero{background:linear-gradient(135deg, #1d4ed8 0%, #6d28d9 100%);color:#fff;border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(29,78,216,0.25)}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .emoji{font-size:26px}
    .brand .title{font-size:18px;font-weight:700;letter-spacing:.3px}
    .brand .sub{font-size:12px;opacity:.9}
    .actions a{background:#fff;color:#1d4ed8;border:1px solid rgba(255,255,255,.6);padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600}
    .actions a:hover{background:#f1f5ff}
    .seg{margin-top:14px;display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(15,23,42,0.06)}
    .seg button{appearance:none;border:0;background:transparent;padding:8px 14px;font-weight:700;color:#334155;cursor:pointer}
    .seg button.active{background:#0b1a4a;color:#fff}
    .period{margin-top:8px;color:#334155;font-size:12px}
    .filters{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .filters label{font-size:12px;color:#334155;display:inline-flex;align-items:center;gap:6px}
    .filters input{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;color:#0f172a}
    table{width:100%;border-collapse:separate;border-spacing:0;margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.06)}
    thead th{background:#0b1a4a;color:#fff;text-align:left;padding:12px 14px;position:sticky;top:0}
    tbody td{padding:12px 14px;border-top:1px solid var(--border)}
    tbody tr:nth-child(even){background:var(--row)}
    tbody tr:nth-child(odd){background:var(--row2)}
    tbody tr:hover{background:var(--hover)}
    td.rank{width:90px}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:34px;padding:0 10px;border-radius:999px;font-weight:800}
    .rank-1{background:linear-gradient(145deg,#fef3c7,#fde68a);color:#8a5800;border:1px solid #fbbf24}
    .rank-2{background:linear-gradient(145deg,#f3f4f6,#e5e7eb);color:#374151;border:1px solid #d1d5db}
    .rank-3{background:linear-gradient(145deg,#fde68a,#fcd34d);color:#7c2d12;border:1px solid #f59e0b}
    .rank-n{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .points{font-weight:700;color:#0b1a4a}
    .name{font-weight:600}
    .muted{color:var(--muted);font-size:12px;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <div class="emoji">🏆</div>
        <div>
          <div class="title">Disneyland Challenge — Top 10</div>
          <div class="sub">Small win to SUCCESS · Leaderboard</div>
        </div>
      </div>
      <div class="actions">
        <a href="/rules" aria-label="กติกาและคะแนน">📜 Rules</a>
      </div>
    </div>

    <div class="seg" role="tablist" aria-label="Leaderboard scope">
      <button type="button" class="active" data-scope="month" aria-selected="true">รายเดือน</button>
      <button type="button" data-scope="week" aria-selected="false">รายสัปดาห์</button>
      <button type="button" data-scope="all" aria-selected="false">ทั้งหมด</button>
    </div>
    <div id="period" class="period"></div>
    <div class="filters">
      <label id="label-month" style="display:none">
        เลือกเดือน:
        <input id="monthPick" type="month" />
      </label>
      <label id="label-week" style="display:none">
        เลือกสัปดาห์:
        <input id="weekPick" type="week" />
      </label>
    </div>

    <table>
      <thead><tr><th>Rank</th><th>Name</th><th>Points</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="muted">อัปเดตทุกชั่วโมง</div>
  </div>
  <script>
    const tbody = document.getElementById('tbody');
    const periodEl = document.getElementById('period');
    const seg = document.querySelector('.seg');
    const monthWrap = document.getElementById('label-month');
    const weekWrap = document.getElementById('label-week');
    const monthPick = document.getElementById('monthPick');
    const weekPick = document.getElementById('weekPick');

    function setActive(scope){
      seg.querySelectorAll('button').forEach(btn=>{
        const on = btn.dataset.scope===scope;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-selected', String(on));
      });
    }

    function labelFor(meta){
      if(!meta) return '';
      if(meta.scope==='week') return `สัปดาห์: ${meta.yw}`;
      if(meta.scope==='month') return `เดือน: ${meta.ym}`;
      return 'รวมทั้งหมด';
    }

    function toggleFilters(scope){
      monthWrap.style.display = scope==='month' ? 'inline-flex' : 'none';
      weekWrap.style.display = scope==='week' ? 'inline-flex' : 'none';
    }

    async function load(scope){
      setActive(scope);
      toggleFilters(scope);
      tbody.innerHTML='';
      periodEl.textContent = '';
      const params = new URLSearchParams({ scope });
      if(scope==='month' && monthPick.value) params.set('ym', monthPick.value);
      if(scope==='week' && weekPick.value) params.set('yw', weekPick.value);
      const res = await fetch(`/top10?${params.toString()}`);
      const payload = await res.json();
      const rows = payload.data || [];
      periodEl.textContent = labelFor(payload.meta);
      rows.forEach((r,i)=>{
        const rank = i+1;
        const cls = rank===1? 'rank-1' : rank===2? 'rank-2' : rank===3? 'rank-3' : 'rank-n';
        const label = rank===1? '🥇 1' : rank===2? '🥈 2' : rank===3? '🥉 3' : String(rank);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank"><span class="badge ${cls}">${label}</span></td>
          <td class="name">${r.display_name}</td>
          <td class="points">${r.points}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    seg.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-scope]');
      if(!btn) return;
      load(btn.dataset.scope);
    });

    async function initFilters(){
      try {
        const [mRes, wRes] = await Promise.all([
          fetch('/months'), fetch('/weeks')
        ]);
        const m = await mRes.json();
        const w = await wRes.json();
        if(m?.current){ monthPick.value = m.current; } else { monthPick.valueAsDate = new Date(); }
        if(w?.current){ weekPick.value = w.current; } else {
          // derive current ISO week value
          const now = new Date();
          const y = now.getFullYear();
          // build approximate ISO week using JS (fallback only)
          const tmp = new Date(now.getTime());
          const day = (tmp.getDay() + 6) % 7; // Mon=0
          tmp.setDate(tmp.getDate() - day + 3);
          const weekYear = tmp.getFullYear();
          const jan4 = new Date(weekYear,0,4);
          const jan4Day = (jan4.getDay()+6)%7;
          const week1Mon = new Date(weekYear,0,4-jan4Day);
          const week = 1 + Math.floor((tmp - week1Mon)/604800000);
          const ww = String(week).padStart(2,'0');
          weekPick.value = `${weekYear}-W${ww}`;
        }
      } catch {}
    }

    monthPick.addEventListener('change', ()=> load('month'));
    weekPick.addEventListener('change', ()=> load('week'));

    (async () => {
      await initFilters();
      load('month');
    })();
  </script>
</body>
</html>
