<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>4S to Silver Challenge — Leaderboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0a08">
  <style>
    :root{
      color-scheme:dark;
      --bg:#0c0a08; --ink:#f7f1e7; --muted:#b9ad9b; --card:#171411; --border:#3b342a;
      --gold:#d8b44a; --red:#a51e2b; --silver:#c4c0b9; --bronze:#b96b42;
      --row:#1d1914; --row2:#15120f; --hover:#2a2117;
    }
    html,body{height:100%}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1000px 600px at 5% -15%,#4c151c88 0,transparent 58%),radial-gradient(800px 500px at 100% -20%,#82611a30 0,transparent 55%),var(--bg);margin:0;color:var(--ink)}
    .wrap{width:min(960px,100%);margin:0 auto;padding:clamp(20px,4vw,32px) clamp(18px,5vw,28px)}
    .hero{background:linear-gradient(120deg,#171411 0%,#211714 60%,#55151b 100%);color:var(--ink);border:1px solid #6f572b;border-radius:18px;padding:clamp(18px,4vw,26px) clamp(20px,5vw,28px);display:flex;align-items:center;gap:clamp(14px,3vw,24px);justify-content:space-between;box-shadow:0 12px 32px #0008,0 0 32px #a77b2520;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
    .brand-mark{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border:1px solid var(--gold);border-radius:14px;color:var(--gold);font-size:16px;font-weight:900;letter-spacing:-.08em}
    .brand .title{font-size:18px;font-weight:750;letter-spacing:.3px}
    .brand .sub{font-size:12px;color:#d4c7b2}
    .actions{flex-shrink:0;display:flex;align-items:center;gap:8px}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:transparent;color:var(--muted);border:1px solid #393229;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:600;transition:background .2s ease,color .2s ease,border-color .2s ease}
    .actions a:hover{background:#211b12;color:#f1d27a;border-color:#67542b}
    .qualification{margin-top:6px;color:#e7d8b7;font-size:13px}
    .qualification strong{color:#f1d27a;font-variant-numeric:tabular-nums}
    .filters{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .filters label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
    .filters input{border:1px solid #67542b;border-radius:8px;padding:7px 9px;background:#171411;color:var(--ink)}
    .countdown{margin-top:14px;padding:12px 14px;border:1px solid #302a22;border-radius:12px;background:#12100e}
    .countdown-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
    .countdown h2{margin:0;color:#d4c7a2;font-size:14px;font-weight:650}
    .countdown-period{color:var(--muted);font-size:11px}
    .countdown-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .countdown-item{padding:9px 11px;border:1px solid #2e2922;border-radius:9px;background:#100e0c}
    .countdown-label{display:block;color:#c5bcae;font-size:12px;font-weight:550}
    .countdown-remaining{display:block;margin:5px 0 7px;color:#d4c58e;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
    .countdown-remaining small{color:var(--muted);font-size:11px;font-weight:500}
    .countdown-phase{display:block;margin:-2px 0 7px;color:var(--muted);font-size:11px}
    .countdown-track{height:5px;overflow:hidden;border-radius:99px;background:#28231d}
    .countdown-progress{height:100%;width:0;border-radius:inherit;background:#a88b44;transition:width .3s ease}
    .countdown-error{margin:0;color:#ffaaa1;font-size:13px}
    .table-wrap{margin-top:20px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid #4a3c25;box-shadow:0 12px 30px #0006}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:980px;border-collapse:separate;border-spacing:0}
    thead th{background:#251d12;color:#e7ca72;text-align:left;padding:14px 12px;position:sticky;top:0;font-size:13px}
    tbody{background:var(--card)}
    tbody tr td{padding:14px 16px;border-top:1px solid #51432f;border-bottom:1px solid #51432f}
    tbody tr td:first-child{border-left:1px solid #51432f;border-radius:10px 0 0 10px}
    tbody tr td:last-child{border-right:1px solid #51432f;border-radius:0 10px 10px 0}
    tbody tr{background:#191612}
    tbody tr:nth-child(even){background:var(--row)}
    tbody tr:nth-child(odd){background:var(--row2)}
    tbody tr:hover td{background:var(--hover);border-color:#766039}
    td.rank{width:76px}
    td.category-points{width:82px;text-align:center;color:#e7d8b7;font-variant-numeric:tabular-nums}
    td.category-points.category-leader{background:#d8b44a0d;color:#f1d27a;font-weight:750}
    td.category-points.category-runner-up{background:#c4c0b90b;color:#e2e0d9;font-weight:700}
    td.category-points.category-third{background:#b96b420b;color:#d58a5b;font-weight:700}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 8px;border-radius:999px;font-size:14px;font-weight:800}
    .rank-1{background:linear-gradient(145deg,#ffe99b,#c99725);color:#241a08;border:1px solid #f3d16d}
    .rank-2{background:linear-gradient(145deg,#e2e0d9,#99958b);color:#191713;border:1px solid #c9c4b8}
    .rank-3{background:linear-gradient(145deg,#d58a5b,#884327);color:#fff3e8;border:1px solid #d78c5d}
    .rank-n{background:#2b1718;color:#f0b5ac;border:1px solid #71333a}
    .points{font-weight:800;color:#f1d27a;font-variant-numeric:tabular-nums}
    .name{font-weight:600}
    .member-card{display:flex;align-items:center;gap:10px;min-width:170px}
    .member-avatar{position:relative;display:grid;place-items:center;width:40px;height:40px;flex:none;overflow:hidden;border:1px solid #9a792c;border-radius:50%;background:linear-gradient(145deg,#55151b,#211b12);color:#f1d27a;font-size:17px;font-weight:850}
    .member-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .member-card-copy{display:grid;gap:3px;min-width:0}
    .member-card-copy strong{overflow-wrap:anywhere}
    .member-level-icon{margin-left:5px;font-size:15px;vertical-align:1px}
    .member-card-copy small{color:var(--muted);font-size:11px;font-weight:500}
    td.level-cell{min-width:170px}
    .level-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
    .level-label strong{color:#f1d27a}
    .level-label span{color:var(--muted);font-size:11px;white-space:nowrap}
    .level-bar{height:8px;overflow:hidden;border-radius:99px;background:#332b20}
    .level-fill{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a51e2b,#d8b44a);transition:width .3s ease}
    .level-stages{display:flex;justify-content:space-between;margin-top:6px;font-size:12px}
    .level-stage{opacity:.35;filter:grayscale(1);transition:opacity .2s ease,filter .2s ease,transform .2s ease}
    .level-stage.is-reached{opacity:.75;filter:none}
    .level-stage.is-current{opacity:1;filter:none;transform:scale(1.2);text-shadow:0 0 8px #d8b44a90}
    .category-title{display:inline-block;margin:4px 0 0 7px;padding:2px 7px;border:1px solid #9a792c;border-radius:999px;color:#f1d27a;font-size:11px;font-weight:700;white-space:nowrap}
    .empty-state{text-align:center;color:var(--muted);padding:28px}
    .muted{color:var(--muted);font-size:12px;margin-top:12px;text-align:right}

    @media (max-width:1024px){
      .wrap{padding:24px clamp(18px,6vw,28px)}
      .hero{gap:18px}
      .brand .title{font-size:clamp(17px,2.8vw,20px)}
      .brand{min-width:0}
      thead th,tbody td{padding:12px 14px}
    }

    @media (max-width:720px){
      .wrap{padding:22px 16px}
      .hero{flex-direction:column;align-items:flex-start;text-align:left;padding:20px}
      .brand{width:100%;gap:10px}
      .brand .title{font-size:17px}
      .brand .sub{font-size:11px}
      .actions{width:100%;flex-wrap:wrap;gap:8px}
      .actions a{flex:1 1 100px;width:auto;min-height:44px;font-size:13px;padding:9px 10px}
      .countdown-head{align-items:flex-start;flex-direction:column;gap:4px}
      .countdown-grid{grid-template-columns:1fr}
      .muted{text-align:left;margin-top:16px}
      table{min-width:0}
      td.rank{width:auto}
    }

    @media (max-width:600px){
      .table-wrap{background:transparent;border:0;box-shadow:none;padding:0}
      .table-scroll{overflow:visible}
      table{min-width:0;border-spacing:0 14px}
      thead{display:none}
      tbody{display:block;padding:4px 0}
      tbody tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border:1px solid #625033;border-radius:14px;background:var(--card);box-shadow:0 8px 20px #0006;padding:16px 14px}
      tbody tr:nth-child(even),tbody tr:nth-child(odd){background:var(--card)}
      tbody tr:hover{background:var(--card)}
      tbody tr:hover td{background:var(--card);border-color:#625033}
      tbody tr td{border:0;border-radius:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;width:auto}
      tbody td[data-label]::before{content:attr(data-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
      tbody td.rank{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;width:auto}
      tbody td.rank::before{content:none}
      tbody td.rank{grid-column:1;flex-direction:row;align-items:center;gap:8px}
      tbody td.name{grid-column:2/-1;align-self:center;font-weight:700;color:var(--ink)}
      tbody td.category-points{align-items:center;text-align:center;padding:9px 3px;border:0;border-radius:6px;background:#201b15;font-size:14px}
      tbody td.category-points::before{text-align:center}
      tbody td.category-points.category-leader{background:#d8b44a12}
      tbody td.category-points.category-runner-up{background:#c4c0b910}
      tbody td.category-points.category-third{background:#b96b4210}
      tbody td.level-cell{grid-column:1/-1;min-width:0}
      tbody td.level-cell::before{content:none}
      tbody td.level-cell{display:block}
      tbody td.points{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 8px 0 0;border-top:1px solid #4a3c25;font-size:18px;text-align:left}
      tbody td.points::before{display:block;color:var(--muted);font-size:12px}
      tbody td.empty-state{grid-column:1/-1;display:block;text-align:center}
      .badge{min-width:38px;height:30px;padding:0 7px;font-size:14px}
    }

    @media (max-width:420px){
      .hero{gap:12px}
      .brand{flex-direction:row;align-items:flex-start}
      .brand-mark{width:40px;height:40px}
      .brand .title{font-size:16px}
      .badge{min-width:36px;height:28px;padding:0 6px;font-size:13px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">4S</div>
        <div>
          <div class="title">Leader Board 4S to Silver</div>
        </div>
      </div>
      <div class="actions">
        <a href="/missions" aria-label="ดูภารกิจประจำเดือน">💎 Missions</a>
        <a href="/profile" aria-label="ดูโปรไฟล์และคำสั่งวันนี้">👤 Profile</a>
        <a href="/rules" aria-label="กติกาและคะแนน">📜 Rules</a>
      </div>
    </div>

    <div id="qualification" class="qualification"></div>

    <section class="countdown" aria-labelledby="countdown-title">
      <div class="countdown-head">
        <h2 id="countdown-title">🎯 ภารกิจรวมประจำเดือน</h2>
        <span id="countdown-period" class="countdown-period"></span>
      </div>
      <p id="countdown-error" class="countdown-error" role="status" hidden></p>
      <div class="countdown-grid" aria-live="polite">
        <article class="countdown-item">
          <span class="countdown-label">📦 เคสสินค้าที่ทำได้</span>
          <strong id="product-done" class="countdown-remaining">— <small>/ 50 เคส</small></strong>
          <span id="product-phase" class="countdown-phase">เฟส 1 · เป้าหมายหลัก</span>
          <div class="countdown-track" role="progressbar" aria-label="เคสสินค้าที่ทำสำเร็จ" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
            <div id="product-progress" class="countdown-progress"></div>
          </div>
        </article>
        <article class="countdown-item">
          <span class="countdown-label">💼 เคสเล่าธุรกิจที่ทำได้</span>
          <strong id="business-done" class="countdown-remaining">— <small>/ 50 เคส</small></strong>
          <span id="business-phase" class="countdown-phase">เฟส 1 · เป้าหมายหลัก</span>
          <div class="countdown-track" role="progressbar" aria-label="เคสเล่าธุรกิจที่ทำสำเร็จ" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0">
            <div id="business-progress" class="countdown-progress"></div>
          </div>
        </article>
      </div>
    </section>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Rank</th><th>Name</th><th>S1 สินค้า</th><th>S2 คน</th>
              <th>S3 ความสำเร็จ</th><th>S4 พัฒนา</th><th>Level</th><th>Total</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="muted">รีเฟรชหน้าเพื่ออัปเดตข้อมูลล่าสุด</div>
  </div>
  <script>
    const tbody = document.getElementById('tbody');
    const qualificationEl = document.getElementById('qualification');
    const countdownPeriod = document.getElementById('countdown-period');
    const countdownError = document.getElementById('countdown-error');

    function renderCountdown(payload){
      const countdown = payload?.data;
      if(!countdown) throw new Error('ข้อมูล Countdown ไม่ครบ');
      const productDone = Number(countdown.productCasesDone);
      const businessDone = Number(countdown.businessCasesDone);
      const productPhase = Number(countdown.productPhase);
      const businessPhase = Number(countdown.businessPhase);
      if(!Number.isInteger(productDone) || productDone < 0 || productDone > 100
        || !Number.isInteger(businessDone) || businessDone < 0 || businessDone > 100
        || ![1, 2].includes(productPhase) || ![1, 2].includes(businessPhase)) {
        throw new Error('ข้อมูล Countdown ไม่ถูกต้อง');
      }
      const productTarget = productPhase === 1 ? 50 : 100;
      const businessTarget = businessPhase === 1 ? 50 : 100;
      const productPhaseDone = productDone - (productPhase === 1 ? 0 : 50);
      const businessPhaseDone = businessDone - (businessPhase === 1 ? 0 : 50);
      document.getElementById('product-done').innerHTML = `${productDone} <small>/ ${productTarget} เคส</small>`;
      document.getElementById('business-done').innerHTML = `${businessDone} <small>/ ${businessTarget} เคส</small>`;
      document.getElementById('product-phase').textContent = productPhase === 1
        ? 'เฟส 1 · เป้าหมายหลัก'
        : 'เฟส 2 · โบนัสถึง 100';
      document.getElementById('business-phase').textContent = businessPhase === 1
        ? 'เฟส 1 · เป้าหมายหลัก'
        : 'เฟส 2 · โบนัสถึง 100';
      document.getElementById('product-progress').style.width = `${productPhaseDone * 2}%`;
      document.getElementById('business-progress').style.width = `${businessPhaseDone * 2}%`;
      const productProgress = document.querySelector('[aria-label="เคสสินค้าที่ทำสำเร็จ"]');
      const businessProgress = document.querySelector('[aria-label="เคสเล่าธุรกิจที่ทำสำเร็จ"]');
      productProgress.setAttribute('aria-valuenow', productPhaseDone);
      businessProgress.setAttribute('aria-valuenow', businessPhaseDone);
      productProgress.setAttribute('aria-valuetext', `${productDone}/${productTarget} เคส · เฟส ${productPhase}`);
      businessProgress.setAttribute('aria-valuetext', `${businessDone}/${businessTarget} เคส · เฟส ${businessPhase}`);
      countdownPeriod.textContent = `เดือน ${payload.meta?.ym || ''}`;
      countdownError.hidden = true;
    }

    function renderCountdownError(){
      countdownError.textContent = 'โหลด Countdown ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
      countdownError.hidden = false;
    }

    function formatPoints(value){
      const num = Number(value);
      if (!Number.isFinite(num)) return '-';
      if (Number.isInteger(num)) return String(num);
      return num.toFixed(2).replace(/\.0+$/, '').replace(/(\.\d*[1-9])0+$/, '$1');
    }

    function getLevelProgress(totalPoints){
      const total = Math.max(0, Number(totalPoints) || 0);
      const level = Math.floor(total / 100);
      return { level, progress: total - level * 100 };
    }

    function getLevelIcon(level){
      const icons = ['🌱', '🌿', '🌳', '🌋', '💎', '🔮', '🌌', '⚡', '🐉', '🌠', '👑'];
      return icons[level % icons.length];
    }

    function getProgressIcons(){
      return ['🌱', '✨', '🔥', '🌟', '🚀'];
    }

    function renderLevelStages(progress){
      const currentStage = Math.min(4, Math.floor(progress / 20));
      return getProgressIcons().map((icon, index) => {
        const state = index < currentStage ? 'is-reached' : index === currentStage ? 'is-current' : '';
        return `<span class="level-stage ${state}" aria-hidden="true">${icon}</span>`;
      }).join('');
    }

    async function loadLeaderboard(){
      tbody.innerHTML='';
      qualificationEl.textContent = '';
      const params = new URLSearchParams({ scope: 'cumulative', limit: 0 });
      const [res, countdownRes] = await Promise.all([
        fetch(`/top10?${params.toString()}`, { cache: 'no-store' }),
        fetch('/countdown', { cache: 'no-store' })
      ]);
      if(!res.ok) throw new Error('โหลดอันดับไม่สำเร็จ');
      const payload = await res.json();
      try {
        if(!countdownRes.ok) throw new Error('โหลด Countdown ไม่สำเร็จ');
        renderCountdown(await countdownRes.json());
      } catch (error) {
        console.error('Countdown load error:', error);
        renderCountdownError();
      }
      const rows = payload.data || [];
      if(!rows.length){
        qualificationEl.textContent = 'คะแนนขั้นต่ำผ่านเกณฑ์: —';
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="8" class="empty-state">ยังไม่มีคะแนน</td>`;
        tbody.appendChild(tr);
        return;
      }
      const topScore = Number(rows[0].points);
      const qualifyingScore = Number.isFinite(topScore)
        ? (topScore * 0.6).toFixed(1)
        : '—';
      qualificationEl.innerHTML = `คะแนนขั้นต่ำผ่านเกณฑ์ (60% ของอันดับ 1): <strong>${qualifyingScore}</strong> คะแนน`;
      const categories = ['s1', 's2', 's3', 's4'];
      const categoryTitles = {
        s1: 'Sales Star',
        s2: 'Team Builder',
        s3: 'Pin Champion',
        s4: 'Growth Champion'
      };
      const categoryScores = Object.fromEntries(categories.map((category) => {
        const scores = rows.map((row) => Number(row[category])).filter((score) => Number.isFinite(score) && score > 0);
        return [category, scores];
      }));
      rows.forEach((r,i)=>{
        const rank = i+1;
        const cls = rank===1? 'rank-1' : rank===2? 'rank-2' : rank===3? 'rank-3' : 'rank-n';
        const label = rank===1? '🥇 1' : rank===2? '🥈 2' : rank===3? '🥉 3' : String(rank);
        const { level, progress: levelProgress } = getLevelProgress(r.points);
        const categoryCell = (category, label, title) => {
          const score = Number(r[category]);
          const place = score > 0
            ? categoryScores[category].filter((otherScore) => otherScore > score).length + 1
            : 0;
          const placeClass = place === 1 ? 'category-leader'
            : place === 2 ? 'category-runner-up'
              : place === 3 ? 'category-third'
                : '';
          const placeTitle = place === 1 ? ' · อันดับ 1'
            : place === 2 ? ' · อันดับ 2'
              : place === 3 ? ' · อันดับ 3'
                : '';
          return `<td class="category-points${placeClass ? ` ${placeClass}` : ''}" data-label="${label}" title="${title}${placeTitle}">${formatPoints(r[category])}</td>`;
        };
        const titles = categories
          .filter((category) => Number(r[category]) > 0
            && categoryScores[category].filter((score) => score > Number(r[category])).length === 0)
          .map((category) => categoryTitles[category]);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank" data-label="อันดับ"><span class="badge ${cls}">${label}</span></td>
          <td class="name"></td>
          ${categoryCell('s1', 'S1', 'S1 สินค้า')}
          ${categoryCell('s2', 'S2', 'S2 คน')}
          ${categoryCell('s3', 'S3', 'S3 ความสำเร็จ')}
          ${categoryCell('s4', 'S4', 'S4 พัฒนา')}
          <td class="level-cell" data-label="Level">
            <div class="level-label"><span>${formatPoints(levelProgress)} / 100 → ${getLevelIcon(level + 1)}</span></div>
            <div class="level-bar" role="progressbar" aria-label="ความคืบหน้าสู่ Level ${level + 1}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${levelProgress}" aria-valuetext="${formatPoints(levelProgress)} จาก 100 คะแนน"><span class="level-fill" style="width:${levelProgress}%"></span></div>
            <div class="level-stages" aria-label="สัญลักษณ์ความคืบหน้าทุก 20 คะแนน">${renderLevelStages(levelProgress)}</div>
          </td>
          <td class="points" data-label="คะแนนรวม">${formatPoints(r.points)}</td>
        `;
        const nameCell = tr.querySelector('.name');
        const memberCard = document.createElement('div');
        memberCard.className = 'member-card';
        const avatar = document.createElement('span');
        avatar.className = 'member-avatar';
        const avatarFallback = document.createElement('span');
        avatarFallback.setAttribute('aria-hidden', 'true');
        avatarFallback.textContent = Array.from(String(r.display_name || 'สมาชิก').trim())[0] || '👤';
        const avatarImage = document.createElement('img');
        avatarImage.alt = '';
        avatarImage.loading = 'lazy';
        avatarImage.referrerPolicy = 'no-referrer';
        avatarImage.src = `/profile/picture?user_id=${encodeURIComponent(r.user_id)}`;
        avatarImage.addEventListener('error', () => avatarImage.remove());
        avatar.append(avatarFallback, avatarImage);
        const memberCopy = document.createElement('span');
        memberCopy.className = 'member-card-copy';
        const memberName = document.createElement('strong');
        memberName.textContent = r.display_name || 'สมาชิก';
        const memberLevelIcon = document.createElement('span');
        memberLevelIcon.className = 'member-level-icon';
        memberLevelIcon.setAttribute('aria-label', `Level ${level}`);
        memberLevelIcon.textContent = getLevelIcon(level);
        memberName.appendChild(memberLevelIcon);
        const memberSummary = document.createElement('small');
        memberSummary.textContent = `Level ${level} · ${formatPoints(r.points)} คะแนน`;
        memberCopy.append(memberName, memberSummary);
        titles.forEach((title) => {
          const titleBadge = document.createElement('span');
          titleBadge.className = 'category-title';
          titleBadge.textContent = title;
          memberCopy.appendChild(titleBadge);
        });
        memberCard.append(avatar, memberCopy);
        nameCell.appendChild(memberCard);
        tbody.appendChild(tr);
      });
    }

    loadLeaderboard();
  </script>
</body>
</html>
