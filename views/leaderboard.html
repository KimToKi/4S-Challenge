<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>4S to Silver Challenge — Top 10</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#f6f7fc; --ink:#0f172a; --muted:#64748b; --card:#ffffff; --border:#e5e7eb;
      --primary:#1d4ed8; --purple:#6d28d9; --gold:#f59e0b; --silver:#9ca3af; --bronze:#b45309;
      --row:#f8fafc; --row2:#f1f5f9; --hover:#eef2ff;
    }
    html,body{height:100%}
    body{font-family:sans-serif;background:radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0, transparent 60%),radial-gradient(900px 500px at 110% -20%, #fae8ff 0, transparent 55%),var(--bg);margin:0;color:var(--ink)}
    .wrap{width:min(960px,100%);margin:0 auto;padding:clamp(20px,4vw,32px) clamp(18px,5vw,28px)}
    .hero{background:linear-gradient(135deg, #1d4ed8 0%, #6d28d9 100%);color:#fff;border-radius:16px;padding:clamp(18px,4vw,26px) clamp(20px,5vw,28px);display:flex;align-items:center;gap:clamp(14px,3vw,24px);justify-content:space-between;box-shadow:0 6px 20px rgba(29,78,216,0.25);flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
    .brand .emoji{font-size:26px;flex-shrink:0}
    .brand .title{font-size:18px;font-weight:700;letter-spacing:.3px}
    .brand .sub{font-size:12px;opacity:.9}
    .actions{flex-shrink:0;display:flex;gap:12px}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;background:#fff;color:#1d4ed8;border:1px solid rgba(255,255,255,.6);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600;transition:background .2s ease,color .2s ease}
    .actions a:hover{background:#f1f5ff}
    .period{margin-top:8px;color:#334155;font-size:12px}
    .filters{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .filters label{font-size:12px;color:#334155;display:inline-flex;align-items:center;gap:6px}
    .filters input{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;color:#0f172a}
    .table-wrap{margin-top:20px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--border);box-shadow:0 8px 24px rgba(15,23,42,0.06)}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:600px;border-collapse:separate;border-spacing:0}
    thead th{background:#0b1a4a;color:#fff;text-align:left;padding:14px 16px;position:sticky;top:0}
    tbody td{padding:14px 16px;border-top:1px solid var(--border)}
    tbody tr:nth-child(even){background:var(--row)}
    tbody tr:nth-child(odd){background:var(--row2)}
    tbody tr:hover{background:var(--hover)}
    td.rank{width:90px}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:36px;padding:0 12px;border-radius:999px;font-weight:800}
    .rank-1{background:linear-gradient(145deg,#fef3c7,#fde68a);color:#8a5800;border:1px solid #fbbf24}
    .rank-2{background:linear-gradient(145deg,#f3f4f6,#e5e7eb);color:#374151;border:1px solid #d1d5db}
    .rank-3{background:linear-gradient(145deg,#fde68a,#fcd34d);color:#7c2d12;border:1px solid #f59e0b}
    .rank-n{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .points{font-weight:700;color:#0b1a4a}
    .name{font-weight:600}
    .muted{color:var(--muted);font-size:12px;margin-top:12px;text-align:right}

    @media (max-width:1024px){
      .wrap{padding:24px clamp(18px,6vw,28px)}
      .hero{gap:18px}
      .brand .title{font-size:clamp(17px,2.8vw,20px)}
      .brand{min-width:0}
      .actions{width:100%;justify-content:flex-start}
      .actions a{flex:1 1 160px;min-width:0}
      table{min-width:0}
      thead th,tbody td{padding:12px 14px}
    }

    @media (max-width:720px){
      body{background:var(--bg)}
      .wrap{padding:22px 16px}
      .hero{flex-direction:column;align-items:flex-start;text-align:left;padding:20px}
      .brand{width:100%;gap:10px}
      .brand .title{font-size:17px}
      .brand .sub{font-size:11px}
      .actions{width:100%}
      .actions a{width:100%;font-size:15px;padding:12px}
      .filters{flex-direction:column;align-items:flex-start}
      .filters label{width:100%}
      .filters input{width:100%;font-size:14px}
      .muted{text-align:left;margin-top:16px}
      table{min-width:100%}
      td.rank{width:72px}
    }

    @media (max-width:600px){
      .table-wrap{background:transparent;border:0;box-shadow:none;padding:0}
      .table-scroll{overflow:visible}
      table{min-width:0;border-spacing:0 14px}
      thead{display:none}
      tbody{display:block;padding:4px 0}
      tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 10px 28px rgba(15,23,42,0.12);padding:16px 14px}
      tbody tr:nth-child(even),tbody tr:nth-child(odd){background:var(--card)}
      tbody tr:hover{background:var(--card)}
      tbody td{border:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px;width:auto}
      tbody td[data-label]::before{content:attr(data-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
      tbody td.rank{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;width:auto}
      tbody td.rank::before{content:none}
      tbody td.name{font-weight:700;color:#0b1a4a}
      tbody td.points{align-items:flex-end;font-size:18px;text-align:right}
      tbody td.points::before{align-self:flex-end;text-align:right;display:block}
      .badge{min-width:46px;height:40px;font-size:18px}
    }

    @media (max-width:420px){
      .hero{gap:12px}
      .brand{flex-direction:row;align-items:flex-start}
      .brand .emoji{font-size:24px}
      .brand .title{font-size:16px}
      .badge{min-width:40px;height:36px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <div class="emoji">🏆</div>
        <div>
          <div class="title">4S to Silver Challenge — Top 10</div>
          <div class="sub">Small win to SUCCESS · Leaderboard</div>
        </div>
      </div>
      <div class="actions">
        <a href="/rules" aria-label="กติกาและคะแนน">📜 Rules</a>
      </div>
    </div>

    <div id="period" class="period"></div>
    <div class="filters">
      <label id="label-month" style="display:none">
        เลือกเดือน:
        <input id="monthPick" type="month" />
      </label>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Rank</th><th>Name</th><th>Points</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="muted">อัปเดตอัตโนมัติทุก 15 วินาที (ไม่แคช)</div>
  </div>
  <script>
    const tbody = document.getElementById('tbody');
    const periodEl = document.getElementById('period');
    const monthWrap = document.getElementById('label-month');
    const monthPick = document.getElementById('monthPick');

    function formatPoints(value){
      const num = Number(value);
      if (!Number.isFinite(num)) return '-';
      if (Number.isInteger(num)) return String(num);
      return num.toFixed(2).replace(/\.0+$/, '').replace(/(\.\d*[1-9])0+$/, '$1');
    }

    function labelFor(meta){
      if(!meta) return '';
      return `เดือน: ${meta.ym || monthPick.value || ''}`;
    }

    async function loadMonth(){
      tbody.innerHTML='';
      periodEl.textContent = '';
      const params = new URLSearchParams({ limit: 0 });
      if(monthPick.value) params.set('ym', monthPick.value);
      const res = await fetch(`/top10?${params.toString()}`, { cache: 'no-store' });
      const payload = await res.json();
      const rows = payload.data || [];
      periodEl.textContent = labelFor(payload.meta);
      if(!rows.length){
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="3" style="text-align:center;color:#64748b;padding:28px">ยังไม่มีคะแนน</td>`;
        tbody.appendChild(tr);
        return;
      }
      rows.forEach((r,i)=>{
        const rank = i+1;
        const cls = rank===1? 'rank-1' : rank===2? 'rank-2' : rank===3? 'rank-3' : 'rank-n';
        const label = rank===1? '🥇 1' : rank===2? '🥈 2' : rank===3? '🥉 3' : String(rank);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank" data-label="อันดับ"><span class="badge ${cls}">${label}</span></td>
          <td class="name" data-label="ชื่อ">${r.display_name}</td>
          <td class="points" data-label="คะแนน">${formatPoints(r.points)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function initFilters(){
      try {
        const mRes = await fetch('/months', { cache: 'no-store' });
        const m = await mRes.json();
        if(m?.current){ monthPick.value = m.current; } else { monthPick.valueAsDate = new Date(); }
      } catch {}
      monthWrap.style.display = 'inline-flex';
    }

    monthPick.addEventListener('change', loadMonth);

    (async () => {
      await initFilters();
      loadMonth();
      setInterval(loadMonth, 15000);
    })();
  </script>
</body>
</html>
